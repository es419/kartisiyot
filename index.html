<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1A2E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="כרטיסיות" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet" />
    <style>html { touch-action: pan-x pan-y; }</style>
    <script>
      // חוסם זום בצביטה (iOS) כדי שהאפליקציה תרגיש native
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault() })
      })
      document.addEventListener('touchmove', function (e) {
        if (e.scale && e.scale !== 1) e.preventDefault()
      }, { passive: false })
    </script>
    <title>כרטיסיות</title>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:100dvh;font:26px 'Secular One',system-ui,sans-serif">
        <img src="/icon.svg" width="96" height="96" alt="" />
      </div>
    </div>
    <style>
      html { background: #F3F6FB; color: #14213D; }
      @media (prefers-color-scheme: dark) { html { background: #0F1A2E; color: #EAF0FF; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
